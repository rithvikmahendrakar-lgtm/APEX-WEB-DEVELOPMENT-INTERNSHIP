<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexPlanet Internship - Task 3: Advanced Styling and JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Task 3: Advanced Styling and JavaScript</h1>
    </header>
    <div class="container">
        <div class="card">
            <h2>Interactive Image Carousel</h2>
            <div class="carousel">
                <img id="carouselImage" src="https://picsum.photos/id/10/600/300" alt="Carousel Image">
            </div>
            <div class="carousel-buttons">
                <button id="prevBtn">Previous</button>
                <button id="nextBtn">Next</button>
            </div>
        </div>
        <div class="card">
            <h2>Fetch Data from Public API</h2>
            <p>Click the button to fetch live data from an external API:</p>
            <div id="apiDataBox">Press the button to load data...</div>
            <button class="api-btn" id="fetchApiBtn">Fetch Data</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
